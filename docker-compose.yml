services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    restart: unless-stopped
    network_mode: host
    user: root
    volumes:
      - /opt/xray:/etc/xray:ro
    command: ["run", "-c", "/etc/xray/config.json"]
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
